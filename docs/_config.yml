# GitHub Pages configuration for the Sigenergy Manager guide.
# Source: the docs/ folder of the main branch, built by GitHub's own Jekyll.
# The theme is fetched at build time, so nothing is vendored here.
title: Sigenergy Manager for Indigo
description: >-
  A plain-English guide to the Sigenergy Manager plugin for Indigo: what it
  does with your solar battery, how to set it up, and what to do when
  something goes wrong.
url: https://highsteads.github.io
baseurl: /SigenEnergyManager
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

# Development and planning papers. They stay in the repository for anyone
# working on the plugin, but they are not part of the published guide.
exclude:
  - agile-readiness-review-2026-09-10.md
  - agile-readiness-review-brief.md
  - daily-energy-revamp.md
  - decomposition-analysis.md
  - decomposition-plan.md
  - happy-hour-import-spec.md
  - flux-changeover-handover.md
  - flux-daily-reports.md

search_enabled: true
heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/Highsteads/SigenEnergyManager
  Download: https://github.com/Highsteads/SigenEnergyManager/releases/latest
aux_links_new_tab: false
footer_content: >-
  © 2026 CliveS · MIT licence
